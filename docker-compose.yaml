services:
  mongodb:
    image: mongo:7.0
    container_name: auction-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=auctions
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=auctions
      - BATCH_INSERT_INTERVAL=100ms
      - MAX_BATCH_SIZE=20
      - AUCTION_INTERVAL=5m
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
